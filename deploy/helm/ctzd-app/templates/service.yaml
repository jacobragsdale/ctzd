{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.fullname }}
  labels:
    {{- include "ctzd-app.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "ctzd-app.selector" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
