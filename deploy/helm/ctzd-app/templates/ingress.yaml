{{- if .Values.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.fullname }}
  labels:
    {{- include "ctzd-app.labels" . | nindent 4 }}
  annotations:
    # Streamlit talks to the browser over a websocket; keep idle connections open.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    {{- if .Values.auth.enabled }}
    # Company sign-in at the ingress (oauth2-proxy for Entra ID); apps never handle identity.
    nginx.ingress.kubernetes.io/auth-url: {{ required "auth.url is required when auth.enabled" .Values.auth.url | quote }}
    nginx.ingress.kubernetes.io/auth-signin: {{ required "auth.signin is required when auth.enabled" .Values.auth.signin | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingressClassName }}
  tls:
    - hosts: [{{ .Values.host | quote }}]
      secretName: {{ .Values.tlsSecretName }}
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.fullname }}
                port:
                  name: http
{{- end }}
