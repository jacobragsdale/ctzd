{{- if .Values.enabled }}
# The app's address, https://<sbu>-<app>.ctzd.contoso.com. The route attaches to the platform's Gateway, whose
# HTTPS listener ends TLS with the wildcard certificate, so the route holds no certificate and a new app needs
# no DNS record or certificate of its own.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.fullname }}
  labels:
    {{- include "ctzd-app.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: {{ .Values.gateway.namespace }}
      name: {{ .Values.gateway.name }}
      sectionName: {{ .Values.gateway.sectionName }}
  hostnames:
    - {{ .Values.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.fullname }}
          port: 80
      # Streamlit talks to the browser over a websocket that can sit idle for a long time. An hour, as the
      # ingress-nginx read and send timeouts were: Envoy Gateway also raises the route's idle timeout to match,
      # in place of Envoy's five-minute stream idle default (unless the Gateway's listener sets its own).
      timeouts:
        request: 3600s
{{- end }}
