# Proposal for the infrastructure owner. Jenkins installs one release per app:
#   helm upgrade --install <sbu>-<app> deploy/helm/ctzd-app --namespace ctzd-apps --atomic --timeout 5m \
#     -f platform-values.yaml -f helm-values.json
# helm-values.json comes from `ctzd ci render`; the keys below are the platform's own settings.

# --- set by `ctzd ci render` from app.toml ---
enabled: true
app: ""
sbu: ""
fullname: ""
image: ""
release: null
host: ""
port: 8080
command: []
readinessPath: /healthz
resources: {}
env: {}
# One Kubernetes secret per source the app lists, such as ctzd-source-fi-pricing.
sourceSecrets: []

# --- platform settings (platform-values.yaml) ---
# The Gateway that the app's HTTPRoute attaches to: the citizen cluster's one Gateway, implemented by Envoy
# Gateway and owned by the platform, not by this chart. Its listener `sectionName` must serve *.ctzd.contoso.com
# over HTTPS with the wildcard certificate and admit HTTPRoutes from this namespace. TLS ends at that listener,
# so apps carry no certificate settings.
gateway:
  name: ctzd
  namespace: envoy-gateway-system
  sectionName: https
# Each source's Key Vault secret is synced into a Kubernetes secret of the same name, holding one
# key CTZD_SOURCE_<NAME>; a pod mounts only the ones in sourceSecrets.
smtpConfigMapName: ctzd-smtp
serviceAccountName: ctzd-app
# Company sign-in at the Gateway, off by default. When on, the chart adds an Envoy Gateway SecurityPolicy to the
# app's route that signs people in with Entra ID (OpenID Connect) before any request reaches the app; no sign-in
# proxy runs. Entra ID's app registration must accept each app's https://<host>/oauth2/callback as a redirect URI.
auth:
  enabled: false
  # https://login.microsoftonline.com/<tenant-id>/v2.0
  issuer: ""
  # The app registration's application (client) id.
  clientID: ""
  # An Opaque Secret in this namespace, synced from Key Vault, holding the client secret under the key client-secret.
  clientSecretName: ""
