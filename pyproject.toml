[project]
name = "ctzd-platform"
version = "0.1.0"
description = "Workspace root for the ctzd citizen-developer platform"
requires-python = ">=3.14"

[dependency-groups]
dev = [
    "ctzd[ci]",
    "ctzd-api",
    "ctzd-core[api,dash]",
    "ctzd-fi",
    "httpx2>=2.16",  # starlette.testclient prefers it
    "pandas-stubs>=3.1",
    "pyarrow-stubs>=20",
    "pre-commit>=4.7",
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "pytest-randomly>=5.0",
    "ruff==0.17.3",
    "ty==0.0.95",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "kits/*"]

[tool.uv.sources]
ctzd = { workspace = true }
ctzd-api = { workspace = true }
ctzd-core = { workspace = true }
ctzd-fi = { workspace = true }
# SHIM (MVP): basis tracks its main branch while the React starter takes shape; pin a release once basis cuts one.
basis-api = { git = "https://github.com/jacobragsdale/basis", branch = "main", subdirectory = "packages/api" }
basis-core = { git = "https://github.com/jacobragsdale/basis", branch = "main", subdirectory = "packages/core" }


[tool.ruff]
line-length = 200
extend-exclude = ["packages/ctzd-cli/src/ctzd_cli/assets", "validation/fixtures"]  # app code; checked by generating an app
src = ["packages/*/src", "kits/*/src", "airflow/dags"]
required-version = ">=0.17.3"
force-exclude = true
show-fixes = true
unsafe-fixes = false

[tool.ruff.lint]
select = ["ALL"]  # Every stable rule; preview rules stay off. Upgrades are deliberate because the version is pinned.
ignore = [
    # Each entry is a rule that cannot be fixed, only turned off. Fix everything else.
    "COM812",  # Conflicts with the formatter; Ruff's docs say to disable it alongside ruff format.
    "ISC001",  # Conflicts with the formatter; Ruff's docs say to disable it alongside ruff format.
    "S603",  # Flags every subprocess call; there is no fix, only review. Pass argv lists, never shell=True (S602).
    "TC001",  # Moving imports under TYPE_CHECKING breaks code that reads annotations at runtime (Pydantic, FastAPI).
    "TC002",  # Moving imports under TYPE_CHECKING breaks code that reads annotations at runtime (Pydantic, FastAPI).
    "TC003",  # Moving imports under TYPE_CHECKING breaks code that reads annotations at runtime (Pydantic, FastAPI).
    "CPY001",  # A copyright header is a legal decision per repository, not a lint fix.
    "D",  # Agents read this code. A required docstring gets written to satisfy the rule; write one only where it says what code and types cannot.
]

[tool.ruff.lint.per-file-ignores]
# pytest's assert is its API, and a test compares against literal expected values.
"**/tests/**" = ["S101", "PLR2004"]
"**/test_*.py" = ["S101", "PLR2004"]
"**/conftest.py" = ["S101", "PLR2004"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false  # Do not preserve comma-forced import line breaks.

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true  # Collapse comma-forced multiline constructs when they fit.

[tool.ty.src]
# App templates are checked by generating an app; the Airflow DAG is checked in its own project (airflow/).
exclude = ["packages/ctzd-cli/src/ctzd_cli/assets", "validation/fixtures", "airflow"]

[tool.ty.rules]
all = "error"  # Every rule is an error, including those ty leaves off by default. Opt out one rule at a time, with a reason.

[tool.ty.analysis]
respect-type-ignore-comments = false  # Require a specific `# ty: ignore[rule]` suppression.
strict-generic-narrowing = true  # isinstance on a generic narrows to its top materialization, e.g. list[object].
strict-equality-semantics = true  # Do not narrow from ==, in, or match value patterns; a subclass can compare equal.

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib -m 'not integration' -p no:dash -p no:basis"  # dash's plugin warns on load; basis-core's blocks sockets, which the dev-server tests open
testpaths = ["packages", "kits"]
norecursedirs = [".*", "build", "dist", "node_modules", "assets", "airflow"]  # assets/ holds app templates, tested by generating an app
xfail_strict = true  # An xfail that starts passing is a failure, not a silent pass.
filterwarnings = [
    "error",  # pandas 3 chained assignment only warns; the lost write is otherwise invisible.
]
markers = [
    "integration: needs a real database, container, or network; excluded from the default run",
]

[tool.coverage.run]
branch = true  # Statement coverage hides the untaken half of every condition.
source = ["packages", "kits"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
# Deliberately no fail_under: coverage is a diagnostic here, not a CI gate.
