[project]
name = "ctzd-core"
version = "0.2.0"
description = "Runtime library for ctzd apps: data sources, caching, the table store, and notifications"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "basis-core",  # ctzd.display, and the drivers and utilities ctzd-core moves onto
    "httpx>=0.28",
    "mssql-python[pyarrow]>=1.17",
    "numpy>=2.5",
    "openpyxl>=3.1",
    "oracledb>=26.1",
    "pandas>=3.1",
    "pyarrow>=26",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
]

[project.optional-dependencies]
# A React app's API: ctzd.api builds a basis-api service from the app's datasets.
api = ["basis-api"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ctzd"
