[project]
name = "ctzd-api"
version = "0.2.0"
description = "The ctzd platform API: repo creation, build status, rollback, job runs, logs, and credentials"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "azure-identity>=1.27",
    "ctzd>=0.1",
    "fastapi>=0.162",
    "httpx>=0.28",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "uvicorn>=0.54",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ctzd_api"
