# Platform settings baked into the ctzd CLI. Every value is a contoso placeholder:
# the company copy of this repository replaces them, or CTZD_PLATFORM_CONFIG
# points at another file with the same shape.
version = 1

[github]
host = "github.contoso.com"
api_url = "https://github.contoso.com/api/v3"
org = "ctzd-apps"
oauth_client_id = "Iv1.0000000000000000"

[platform]
api_url = "https://api.ctzd.contoso.com"
apps_domain = "ctzd.contoso.com"
airflow_url = "https://airflow.ctzd.contoso.com"
registry = "contosoctzd.azurecr.io"
base_image = "contosoctzd.azurecr.io/ctzd/base:py3.13"
store_url = "abfs://ctzd@contosoctzdstore.dfs.core.windows.net"
mingit_url = "https://ctzd.contoso.com/downloads/MinGit-64-bit.zip"

[python]
requires = ">=3.13"
build_backend = "uv_build>=0.13.6,<0.14"
dev = [
    "import-linter==2.15",
    "pandas-stubs==3.1.0.261029",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "ty==0.0.95",
]

[[python.index]]
name = "internal"
url = "https://pypi.contoso.com/simple"
default = true

# Resources per app.toml size. Requests stay small so idle dashboards cost little.
[sizes.s]
cpu_request = "100m"
cpu_limit = "500m"
memory_request = "512Mi"
memory_limit = "1Gi"

[sizes.m]
cpu_request = "100m"
cpu_limit = "1"
memory_request = "1Gi"
memory_limit = "4Gi"

[sizes.l]
cpu_request = "250m"
cpu_limit = "2"
memory_request = "2Gi"
memory_limit = "8Gi"

[ui.streamlit]
dependencies = ["streamlit>=1.66"]

[ui.dash]
dependencies = ["dash[ag-grid]>=4.5", "gunicorn>=26.2"]

[ui.none]
dependencies = []

[sbus.fi]
name = "Fixed Income"
library = "ctzd-fi>=0.1"
github_team = "sbu-fi"
