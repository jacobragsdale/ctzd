[project]
name = "{{kit_package}}"
version = "0.1.0"
description = "{{title}}'s kit for ctzd apps: its sources, loaders and helpers"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ctzd-kit>=0.1,<1",
]

[project.entry-points."ctzd.kits"]
{{sbu}} = "{{kit}}"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "{{kit}}"
