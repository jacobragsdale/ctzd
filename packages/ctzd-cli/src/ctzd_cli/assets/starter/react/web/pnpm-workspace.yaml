# The page's pnpm settings. @basis/parallax depends on @basis/ui, which comes from the same place as the app's.
overrides:
  "@basis/ui": "{{npm:@basis/ui}}"
  # orval brings TypeScript 6 with it; one TypeScript in the tree.
  typescript: 7.0.2
# SHIM (MVP): until the internal registry serves basis-ui's packages, they may come from a tarball URL, which
# pnpm refuses for @basis/ui under @basis/parallax unless this is off. Remove it with the registry.
blockExoticSubdeps: false
# esbuild's install script only checks the binary pnpm already installs.
allowBuilds:
  esbuild: false
