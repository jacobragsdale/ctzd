# Platform settings baked into the ctzd CLI: where the platform's services are, and its departments. Every value is a
# contoso placeholder: the firm's fork replaces them, or CTZD_PLATFORM_CONFIG points at another file with the same
# shape. What goes into apps (templates, build files, guidance, tool pins, the package index) is in assets/.
version = 3

[github]
host = "github.com"
api_url = "https://api.github.com"
org = "contoso-ctzd-apps"
oauth_client_id = "Ov23li00000000000000"

[platform]
registry = "contosoctzd.azurecr.io"
base_image = "contosoctzd.azurecr.io/ctzd/base:py3.14"
mingit_url = "https://ctzd.contoso.com/downloads/MinGit-64-bit.zip"

[environments.dev]
apps_domain = "ctzd-dev.contoso.com"
airflow_url = "https://airflow.ctzd-dev.contoso.com"
key_vault = "https://contoso-ctzd-dev.vault.azure.net"
store_url = "abfs://ctzd-dev@contosoctzdstore.dfs.core.windows.net"

[environments.prod]
apps_domain = "ctzd.contoso.com"
airflow_url = "https://airflow.ctzd.contoso.com"
key_vault = "https://contoso-ctzd-prod.vault.azure.net"
store_url = "abfs://ctzd-prod@contosoctzdstore.dfs.core.windows.net"

# Resources per app.toml size. Requests stay small so idle dashboards cost little.
[sizes.s]
cpu_request = "100m"
cpu_limit = "500m"
memory_request = "512Mi"
memory_limit = "1Gi"

[sizes.m]
cpu_request = "100m"
cpu_limit = "1"
memory_request = "1Gi"
memory_limit = "4Gi"

[sizes.l]
cpu_request = "250m"
cpu_limit = "2"
memory_request = "2Gi"
memory_limit = "8Gi"

# The departments. A new one is a new kit in kits/<sbu> and a CLI release that lists it here.
[sbus.fi]
name = "Fixed Income"
kit = "ctzd-fi>=0.1,<1"
github_team = "sbu-fi"

[sbus.mas]
name = "Multi-Asset Solutions"
kit = "ctzd-mas>=0.1,<1"
github_team = "sbu-mas"
