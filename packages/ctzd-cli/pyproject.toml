[project]
name = "ctzd"
version = "0.5.0"
description = "The ctzd command line: create, check, and deploy citizen-developer apps"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "croniter>=6.2.2",
    "httpx>=0.28",
    "keyring>=25.7",
    "packaging>=25",
    "pydantic>=2.14",
    "sqlglot>=30.29",
    "tomlkit>=0.15",
    "tzdata>=2025.2; sys_platform == 'win32'",  # Windows has no time zone database for zoneinfo
]

[project.scripts]
ctzd = "ctzd_cli.main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ctzd_cli"
