[project]
name = "ctzd-kit"
version = "0.1.0"
description = "What every ctzd department kit builds on: the loader seam, fakes, the table store, drivers and the source explorer"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ctzd-common>=0.1,<1",
    "httpx>=0.28",
    "mssql-python[pyarrow]>=1.17",
    "numpy>=2.5",
    "openpyxl>=3.1",
    "oracledb>=26.1",
    "pandas>=3.1",
    "pyarrow>=26",
    "pydantic>=2.14",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ctzd_kit"
