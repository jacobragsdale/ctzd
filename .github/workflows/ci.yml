name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest

  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - run: npm install --global pnpm@12.18.0
      - run: uv sync --locked
      # A React app needs basis-ui's packages; until basis-ui publishes them at a URL, set as
      # CTZD_BASIS_UI_URL here, e2e.sh checks the jobs-only app and says it skipped the React one.
      - run: scripts/e2e.sh

  airflow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: airflow
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run --with ty==0.0.95 ty check dags tests
