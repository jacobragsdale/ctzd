[project]
name = "ctzd-fi"
version = "0.1.0"
description = "FI (fixed income) library for ctzd apps: the SBU's package stack and shared loaders"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ctzd-core>=0.1",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ctzd_fi"
